<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>6-Weeks Average</title>

  <!-- link the webpage's stylesheet -->
  <link rel="stylesheet" href="../style.css" />

  <!-- link the webpage's JavaScript file -->
  <script src="./6weeks.js" defer></script>
</head>

<body>

  <main>

    <nav>
      <ul class="nav">
         <li class="nav-li"><a href="index.html">Home</a></li>
        <li class="nav-li"><a href="faqs.html">FAQS</a></li>
      </ul>
    </nav>

    <header>
      <h1>6-Weeks Average</h1>
    </header>

    <div id="majorGrades">
    <h3>Major Grades:</h3> </br>
    <label for="major1">Major 1</label>
    <input type="number" id="major1" name="major1"> </br>
    </div>
    <button class="addbtn" id="addMajor" onclick="addMajorInput()">Add Major</button> </br>

    <div id="minorGrades">
    <h3>Minor Grades:</h3> </br>
    <label for="minor1">Minor 1</label>
    <input type="number" id="minor1" name="minor1"> </br>
    </div>
    <button class="addbtn" id="addMinor" onclick="addMinorInput()">Add Minor</button> </br>

    <label>What type of class is this?</label> </br>
    <label for="academic">Academic/Pre-AP</label>
    <input class="radio"type="radio" id="academic" name="classType"> </br>
    <label for="AP">AP/Dual/OnRamps</label>
    <input class="radio" type="radio" id="AP" name="classType"> </br>

    <button class="submitbtn" id="submit6Weeks">Calculate!</button>

    <p class="display" id="6WeeksAverage">Your 6-Weeks Average Is...</p>

    <footer>
      <p>Made By Rachel Le</p>
    </footer>
    
  </main>
  
</body>

</html>
